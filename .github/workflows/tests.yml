name: tests
on:
  pull_request:
  push:
    branches: [main, v1-launch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python3 -I tools/validate_feed.py -q
      - run: python3 -I -m unittest discover -s tests
      - run: cd tools && npm install --no-audit --no-fund
      - run: |
          export NODE_PATH=$PWD/tools/node_modules
          node tools/test_i18n.mjs
          for l in en es fr ru zh ar; do node tools/test_i18n.mjs $l; done
          node tests/test_v1.mjs
